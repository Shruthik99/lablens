[project]
name = "lablens"
version = "0.0.1"
description = "Lab Lens MLOps project"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.17.6",
    "black==26.10.1",
    "pre-commit>=3.7",
]

notebooks = [
    "datasets",
    "pandas",
    "jupyter",
    "ipykernel",
    "nbstripout",
    "kagglehub",
    "pillow",
]

tracking = [
    "mlflow>=2.0",
]

api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

train = [
    "transformers>=4.40",
    "datasets>=2.19",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "accelerate>=1.1.0",
]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lablens = ["resources/*.txt", "static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["BLE001", "E402"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
